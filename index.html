<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a73e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Family Manager</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --primary: #1a73e8;
            --primary-dark: #1557b0;
            --primary-light: #e8f0fe;
            --success: #34a853;
            --warning: #fbbc04;
            --danger: #ea4335;
            --bg: #f8f9fa;
            --surface: #ffffff;
            --text: #202124;
            --text-secondary: #5f6368;
            --border: #dadce0;
            --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
            --shadow-lg: 0 4px 12px rgba(0,0,0,0.15);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Noto Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* LOGIN SCREEN */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .login-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 40px 32px;
            width: 100%;
            max-width: 380px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .login-card h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text);
        }

        .login-card p {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 14px;
        }

        .login-card .app-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .login-card .app-icon .material-icons-round {
            font-size: 36px;
            color: white;
        }

        .member-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .member-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .member-btn:hover, .member-btn:active {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .member-btn .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            color: white;
            flex-shrink: 0;
        }

        .member-btn .info { flex: 1; }
        .member-btn .info .name { font-weight: 600; font-size: 15px; }
        .member-btn .info .role { font-size: 12px; color: var(--text-secondary); }

        .pin-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .pin-input {
            display: flex;
            gap: 8px;
        }

        .pin-input input {
            width: 48px;
            height: 56px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            outline: none;
            transition: border-color 0.2s;
        }

        .pin-input input:focus {
            border-color: var(--primary);
        }

        .pin-error {
            color: var(--danger);
            font-size: 13px;
            display: none;
        }

        /* LANGUAGE SELECTOR */
        .lang-selector {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 16px;
        }

        .lang-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: transparent;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* MAIN APP */
        .app-container {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }

        /* TOP BAR */
        .top-bar {
            background: var(--surface);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-bar .left { display: flex; align-items: center; gap: 12px; }
        .top-bar .user-info { display: flex; align-items: center; gap: 10px; }
        .top-bar .user-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 14px; color: white;
        }
        .top-bar .user-name { font-weight: 600; font-size: 15px; }
        .top-bar .user-role { font-size: 11px; color: var(--text-secondary); }

        .top-bar .right { display: flex; align-items: center; gap: 8px; }

        .icon-btn {
            width: 36px; height: 36px; border-radius: 50%;
            border: none; background: transparent; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-secondary); transition: background 0.2s;
        }
        .icon-btn:hover { background: var(--bg); }

        /* CONTENT */
        .content {
            flex: 1;
            padding: 16px;
            padding-bottom: 80px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* DATE HEADER */
        .date-header {
            text-align: center;
            padding: 16px 0;
        }
        .date-header h2 { font-size: 20px; font-weight: 700; }
        .date-header p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

        /* PROGRESS BAR */
        .progress-section {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .progress-header span { font-size: 14px; font-weight: 500; }
        .progress-header .pct { color: var(--primary); font-weight: 700; }

        .progress-bar {
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #667eea);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* CATEGORY TABS */
        .category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 12px;
            -webkit-overflow-scrolling: touch;
        }
        .category-tabs::-webkit-scrollbar { display: none; }

        .cat-tab {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* TASK CARDS */
        .task-list { display: flex; flex-direction: column; gap: 8px; }

        .task-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow);
            transition: all 0.2s;
            cursor: pointer;
        }
        .task-card:active { transform: scale(0.98); }
        .task-card.completed { opacity: 0.6; }
        .task-card.completed .task-title { text-decoration: line-through; }

        .task-check {
            width: 26px; height: 26px; border-radius: 50%;
            border: 2.5px solid var(--border); flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .task-card.completed .task-check {
            background: var(--success);
            border-color: var(--success);
        }
        .task-card.completed .task-check::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: 700;
        }

        .task-content { flex: 1; }
        .task-title { font-size: 14px; font-weight: 500; }
        .task-time {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .task-time .material-icons-round { font-size: 14px; }

        .task-category-badge {
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
            flex-shrink: 0;
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 max(8px, env(safe-area-inset-bottom));
            box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 11px;
        }
        .nav-item.active { color: var(--primary); }
        .nav-item .material-icons-round { font-size: 24px; }

        /* FAB */
        .fab {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--primary);
            color: white;
            border: none;
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            z-index: 50;
        }
        .fab:active { transform: scale(0.9); }
        .fab .material-icons-round { font-size: 28px; }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--surface);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
        }

        .form-group .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .form-group .chip {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .form-group .chip.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn {
            padding: 14px 24px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary {
            background: var(--bg);
            color: var(--text);
            margin-top: 8px;
        }

        /* STATS VIEW */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }
        .stat-card .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* FAMILY VIEW (parents only) */
        .family-member-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .family-member-card .progress-mini {
            width: 44px; height: 44px;
            position: relative;
        }
        .family-member-card .fm-info { flex: 1; }
        .family-member-card .fm-name { font-weight: 600; font-size: 14px; }
        .family-member-card .fm-stats { font-size: 12px; color: var(--text-secondary); }

        /* MENU SECTION */
        .menu-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }
        .menu-card h4 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
        .menu-item {
            padding: 8px 0;
            border-bottom: 1px solid var(--bg);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .menu-item:last-child { border-bottom: none; }

        /* RESPONSIVE */
        @media (min-width: 768px) {
            .content { padding: 24px; padding-bottom: 80px; }
            .modal { border-radius: 20px; margin-bottom: 20px; }
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* HIDDEN UTILITY */
        .hidden { display: none !important; }

        /* Streak badge */
        .streak-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: linear-gradient(135deg, #ff9800, #f44336);
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .empty-state .material-icons-round {
            font-size: 48px;
            opacity: 0.5;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <div class="app-icon">
            <span class="material-icons-round">family_restroom</span>
        </div>
        <h1 data-i18n="appTitle">Family Manager</h1>
        <p data-i18n="selectMember">Select your profile to continue</p>

        <div id="memberListView">
            <div class="member-list" id="memberList"></div>
        </div>

        <div id="pinView" class="pin-screen">
            <p id="pinPrompt" data-i18n="enterPin">Enter your PIN</p>
            <div class="pin-input" id="pinInput">
                <input type="password" maxlength="1" inputmode="numeric">
                <input type="password" maxlength="1" inputmode="numeric">
                <input type="password" maxlength="1" inputmode="numeric">
                <input type="password" maxlength="1" inputmode="numeric">
            </div>
            <p class="pin-error" id="pinError" data-i18n="wrongPin">Wrong PIN. Try again.</p>
            <button class="btn btn-secondary" onclick="showMemberList()" data-i18n="back">Back</button>
        </div>

        <div class="lang-selector">
            <button class="lang-btn active" onclick="setLang('en')">EN</button>
            <button class="lang-btn" onclick="setLang('ru')">RU</button>
            <button class="lang-btn" onclick="setLang('tj')">TJ</button>
        </div>
    </div>
</div>

<!-- MAIN APP -->
<div id="appContainer" class="app-container">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="left">
            <div class="user-info">
                <div class="user-avatar" id="topAvatar"></div>
                <div>
                    <div class="user-name" id="topName"></div>
                    <div class="user-role" id="topRole"></div>
                </div>
            </div>
        </div>
        <div class="right">
            <div class="lang-selector" style="margin:0">
                <button class="lang-btn lang-btn-sm active" onclick="setLang('en')" style="padding:4px 10px;font-size:11px">EN</button>
                <button class="lang-btn lang-btn-sm" onclick="setLang('ru')" style="padding:4px 10px;font-size:11px">RU</button>
                <button class="lang-btn lang-btn-sm" onclick="setLang('tj')" style="padding:4px 10px;font-size:11px">TJ</button>
            </div>
            <button class="icon-btn" onclick="logout()">
                <span class="material-icons-round">logout</span>
            </button>
        </div>
    </div>

    <!-- Content Area -->
    <div class="content" id="mainContent">
        <!-- Filled dynamically -->
    </div>

    <!-- FAB (parents only) -->
    <button class="fab hidden" id="fabBtn" onclick="openAddModal()">
        <span class="material-icons-round">add</span>
    </button>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('today')" data-tab="today">
            <span class="material-icons-round">today</span>
            <span data-i18n="navToday">Today</span>
        </button>
        <button class="nav-item" onclick="switchTab('routines')" data-tab="routines">
            <span class="material-icons-round">repeat</span>
            <span data-i18n="navRoutines">Routines</span>
        </button>
        <button class="nav-item" onclick="switchTab('menu')" data-tab="menu">
            <span class="material-icons-round">restaurant</span>
            <span data-i18n="navMenu">Menu</span>
        </button>
        <button class="nav-item" onclick="switchTab('stats')" data-tab="stats">
            <span class="material-icons-round">bar_chart</span>
            <span data-i18n="navStats">Stats</span>
        </button>
        <button class="nav-item hidden" id="navFamily" onclick="switchTab('family')" data-tab="family">
            <span class="material-icons-round">group</span>
            <span data-i18n="navFamily">Family</span>
        </button>
    </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <h3 id="modalTitle" data-i18n="addTask">Add Task</h3>
        <form id="taskForm" onsubmit="saveTask(event)">
            <div class="form-group">
                <label data-i18n="taskName">Task Name</label>
                <input type="text" id="taskNameInput" required>
            </div>
            <div class="form-group">
                <label data-i18n="category">Category</label>
                <select id="taskCategory">
                    <option value="routine" data-i18n="catRoutine">Morning/Evening Routine</option>
                    <option value="chore" data-i18n="catChore">Household Chore</option>
                    <option value="islamic" data-i18n="catIslamic">Islamic Duty</option>
                    <option value="habit" data-i18n="catHabit">Habit</option>
                    <option value="duty" data-i18n="catDuty">Duty/Responsibility</option>
                    <option value="menu" data-i18n="catMenu">Menu/Meal</option>
                    <option value="program" data-i18n="catProgram">Program/Activity</option>
                </select>
            </div>
            <div class="form-group">
                <label data-i18n="time">Time (optional)</label>
                <input type="time" id="taskTime">
            </div>
            <div class="form-group">
                <label data-i18n="assignTo">Assign To</label>
                <div class="chips" id="assignChips"></div>
            </div>
            <div class="form-group">
                <label data-i18n="repeat">Repeat</label>
                <select id="taskRepeat">
                    <option value="daily" data-i18n="daily">Daily</option>
                    <option value="weekdays" data-i18n="weekdays">Weekdays</option>
                    <option value="weekends" data-i18n="weekends">Weekends</option>
                    <option value="weekly" data-i18n="weekly">Weekly</option>
                    <option value="once" data-i18n="once">Once</option>
                </select>
            </div>
            <div class="form-group">
                <label data-i18n="notes">Notes (optional)</label>
                <textarea id="taskNotes" rows="2"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" data-i18n="save">Save</button>
            <button type="button" class="btn btn-secondary" onclick="closeModal()" data-i18n="cancel">Cancel</button>
        </form>
    </div>
</div>

<!-- MENU MODAL -->
<div class="modal-overlay" id="menuModalOverlay" onclick="closeMenuModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <h3 data-i18n="addMenu">Add Menu Item</h3>
        <form id="menuForm" onsubmit="saveMenu(event)">
            <div class="form-group">
                <label data-i18n="mealType">Meal Type</label>
                <select id="mealType">
                    <option value="breakfast" data-i18n="breakfast">Breakfast</option>
                    <option value="lunch" data-i18n="lunch">Lunch</option>
                    <option value="dinner" data-i18n="dinner">Dinner</option>
                    <option value="snack" data-i18n="snack">Snack</option>
                </select>
            </div>
            <div class="form-group">
                <label data-i18n="dishName">Dish Name</label>
                <input type="text" id="menuDishInput" required>
            </div>
            <div class="form-group">

function renderMemberList() {
    const list = document.getElementById('memberList');
    list.innerHTML = familyMembers.map(m => `

            <div class="avatar" style="background:${m.color}">${m.initials}</div>

}

function getMemberName(member) {
    if (currentLang === 'ru') return member.nameRu;
    if (currentLang === 'tj') return member.nameTj;
    return member.name;
}

function selectMember(id) {
    selectedMember = familyMembers.find(m => m.id === id);
    document.getElementById('memberListView').style.display = 'none';
    document.getElementById('pinView').style.display = 'flex';
    document.getElementById('pinError').style.display = 'none';
    const inputs = document.querySelectorAll('#pinInput input');
    inputs.forEach(i => i.value = '');
    inputs[0].focus();
}

function showMemberList() {
    document.getElementById('memberListView').style.display = 'block';
    document.getElementById('pinView').style.display = 'none';
    selectedMember = null;
}

// PIN input handling
document.querySelectorAll('#pinInput input').forEach((input, idx, inputs) => {
    input.addEventListener('input', (e) => {
        if (e.target.value && idx < inputs.length - 1) {
            inputs[idx + 1].focus();
        }
        if (idx === inputs.length - 1 && e.target.value) {
            const pin = Array.from(inputs).map(i => i.value).join('');
            verifyPin(pin);
        }
    });
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && idx > 0) {
            inputs[idx - 1].focus();
        }
    });
});

function verifyPin(pin) {
    if (selectedMember && pin === selectedMember.pin) {
        currentUser = selectedMember;
        localStorage.setItem('fm_currentUser', currentUser.id);
        enterApp();
    } else {
        document.getElementById('pinError').style.display = 'block';
        const inputs = document.querySelectorAll('#pinInput input');
        inputs.forEach(i => i.value = '');
        inputs[0].focus();
    }
}

function enterApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appContainer').style.display = 'flex';
    document.getElementById('topAvatar').style.background = currentUser.color;
    document.getElementById('topAvatar').textContent = currentUser.initials;
    document.getElementById('topName').textContent = getMemberName(currentUser);
    document.getElementById('topRole').textContent = t(currentUser.role);

    // Show FAB and Family tab for parents only
    if (currentUser.role === 'parent') {
        document.getElementById('fabBtn').classList.remove('hidden');
        document.getElementById('navFamily').classList.remove('hidden');
    } else {
        document.getElementById('fabBtn').classList.add('hidden');
        document.getElementById('navFamily').classList.add('hidden');
    }

    renderCurrentTab();
}

function logout() {
    currentUser = null;
    localStorage.removeItem('fm_currentUser');
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('appContainer').style.display = 'none';
    showMemberList();
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

    // Show/hide FAB based on tab
    if (currentUser.role === 'parent') {
        if (tab === 'stats' || tab === 'family') {
            document.getElementById('fabBtn').classList.add('hidden');
        } else {
            document.getElementById('fabBtn').classList.remove('hidden');
        }
    }

    renderCurrentTab();
}

function renderCurrentTab() {
    const content = document.getElementById('mainContent');
    switch(currentTab) {
        case 'today': renderToday(content); break;
        case 'routines': renderRoutines(content); break;
        case 'menu': renderMenu(content); break;
        case 'stats': renderStats(content); break;
        case 'family': renderFamily(content); break;
    }
}

// ==================== TODAY VIEW ====================
function renderToday(container) {
    const data = getData();
    const today = getTodayKey();
    const myTasks = data.tasks.filter(task => task.assignedTo.includes(currentUser.id) && isTaskForToday(task));
    const completions = data.completions[today] || {};
    const completed = myTasks.filter(task => completions[`${currentUser.id}_${task.id}`]);
    const pct = myTasks.length ? Math.round((completed.length / myTasks.length) * 100) : 0;

    const now = new Date();
    const dateStr = now.toLocaleDateString(currentLang === 'ru' ? 'ru-RU' : currentLang === 'tj' ? 'tg-TJ' : 'en-US',
        { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    container.innerHTML = `
        <div class="date-header">
            <h2>${t('todayProgress')}</h2>
            <p>${dateStr}</p>
        </div>
        <div class="progress-section">
            <div class="progress-header">
                <span>${completed.length}/${myTasks.length} ${t('tasksCompleted')}</span>
                <span class="pct">${pct}%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width:${pct}%"></div>
            </div>
        </div>
        <div class="category-tabs">
            <button class="cat-tab active" onclick="filterTasks('all')">${t('allCategories')}</button>
            <button class="cat-tab" onclick="filterTasks('routine')">${t('catRoutine')}</button>
            <button class="cat-tab" onclick="filterTasks('islamic')">${t('catIslamic')}</button>
            <button class="cat-tab" onclick="filterTasks('chore')">${t('catChore')}</button>
            <button class="cat-tab" onclick="filterTasks('habit')">${t('catHabit')}</button>
            <button class="cat-tab" onclick="filterTasks('duty')">${t('catDuty')}</button>
            <button class="cat-tab" onclick="filterTasks('program')">${t('catProgram')}</button>
        </div>
        <div class="task-list" id="taskList">
            ${renderTaskList(myTasks, completions)}
        </div>
    `;
}

function renderTaskList(tasks, completions, filter = 'all') {
    let filtered = filter === 'all' ? tasks : tasks.filter(t => t.category === filter);
    filtered.sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));

    if (filtered.length === 0) {
        return `<div class="empty-state"><span class="material-icons-round">check_circle</span><p>${t('noTasks')}</p></div>`;
    }

    return filtered.map(task => {
        const key = `${currentUser.id}_${task.id}`;
        const done = completions[key];
        const catColors = { routine: '#1a73e8', islamic: '#34a853', chore: '#fbbc04', habit: '#9c27b0', duty: '#ea4335', menu: '#ff9800', program: '#00bcd4' };
        const taskName = currentLang === 'ru' ? (task.nameRu || task.name) : currentLang === 'tj' ? (task.nameTj || task.name) : task.name;

        return `
            <div class="task-card ${done ? 'completed' : ''}" onclick="toggleTask('${task.id}')" ${currentUser.role === 'parent' ? `oncontextmenu="showTaskOptions(event, '${task.id}')"` : ''}>
                <div class="task-check"></div>
                <div class="task-content">
                    <div class="task-title">${taskName}</div>
                    ${task.time ? `<div class="task-time"><span class="material-icons-round">schedule</span>${task.time}</div>` : ''}
                </div>
                <span class="task-category-badge" style="background:${catColors[task.category]}20;color:${catColors[task.category]}">${t('cat' + task.category.charAt(0).toUpperCase() + task.category.slice(1))}</span>
            </div>
        `;
    }).join('');
}

function filterTasks(category) {
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');

    const data = getData();
    const today = getTodayKey();
    const myTasks = data.tasks.filter(task => task.assignedTo.includes(currentUser.id) && isTaskForToday(task));
    const completions = data.completions[today] || {};
    document.getElementById('taskList').innerHTML = renderTaskList(myTasks, completions, category);
}

function toggleTask(taskId) {
    const data = getData();
    const today = getTodayKey();
    if (!data.completions[today]) data.completions[today] = {};
    const key = `${currentUser.id}_${taskId}`;
    data.completions[today][key] = !data.completions[today][key];

    // Update streak
    updateStreak(data);
    saveData(data);
    renderCurrentTab();
}

function updateStreak(data) {
    if (!data.streaks) data.streaks = {};
    if (!data.streaks[currentUser.id]) data.streaks[currentUser.id] = 0;

    const today = getTodayKey();
    const myTasks = data.tasks.filter(t => t.assignedTo.includes(currentUser.id) && isTaskForToday(t));
    const completions = data.completions[today] || {};
    const allDone = myTasks.every(t => completions[`${currentUser.id}_${t.id}`]);

    if (allDone && myTasks.length > 0) {
        data.streaks[currentUser.id] = (data.streaks[currentUser.id] || 0) + 1;
    }
}

// ==================== ROUTINES VIEW ====================
function renderRoutines(container) {
    const data = getData();
    const myTasks = data.tasks.filter(task => task.assignedTo.includes(currentUser.id));
    const categories = ['routine', 'islamic', 'chore', 'habit', 'duty', 'program'];

    container.innerHTML = `
        <div class="date-header">
            <h2>${t('navRoutines')}</h2>
            <p>${myTasks.length} ${t('totalTasks').toLowerCase()}</p>
        </div>
        ${categories.map(cat => {
            const catTasks = myTasks.filter(t => t.category === cat);
            if (catTasks.length === 0) return '';
            return `
                <div style="margin-bottom:16px">
                    <h4 style="font-size:14px;font-weight:600;margin-bottom:8px;color:var(--text-secondary)">${t('cat' + cat.charAt(0).toUpperCase() + cat.slice(1))} (${catTasks.length})</h4>
                    <div class="task-list">
                        ${catTasks.map(task => {
                            const taskName = currentLang === 'ru' ? (task.nameRu || task.name) : currentLang === 'tj' ? (task.nameTj || task.name) : task.name;
                            return `
                                <div class="task-card" ${currentUser.role === 'parent' ? `onclick="editTask('${task.id}')"` : ''}>
                                    <div class="task-content">
                                        <div class="task-title">${taskName}</div>
                                        <div class="task-time">
                                            ${task.time ? `<span class="material-icons-round">schedule</span>${task.time} · ` : ''}
                                            ${t(task.repeat)}
                                        </div>
                                    </div>
                                    ${currentUser.role === 'parent' ? `<button class="icon-btn" onclick="event.stopPropagation();deleteTask('${task.id}')"><span class="material-icons-round" style="color:var(--danger);font-size:20px">delete</span></button>` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }).join('')}
    `;
}

// ==================== MENU VIEW ====================
function renderMenu(container) {
    const data = getData();
    const days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
    const today = new Date().toLocaleDateString('en-US', {weekday:'long'}).toLowerCase();

    container.innerHTML = `
        <div class="date-header">
            <h2>${t('weeklyMenu')}</h2>
        </div>
        ${days.map(day => {
            const menu = data.menus.find(m => m.day === day) || {};
            const isToday = day === today;
            return `
                <div class="menu-card" style="${isToday ? 'border:2px solid var(--primary)' : ''}">
                    <h4 style="${isToday ? 'color:var(--primary)' : ''}">${t(day)} ${isToday ? '⭐' : ''}</h4>
                    <div class="menu-item"><span class="material-icons-round" style="color:#ff9800;font-size:18px">wb_sunny</span> <strong>${t('breakfast')}:</strong>&nbsp;${menu.breakfast || '—'}</div>
                    <div class="menu-item"><span class="material-icons-round" style="color:#f44336;font-size:18px">light_mode</span> <strong>${t('lunch')}:</strong>&nbsp;${menu.lunch || '—'}</div>
                    <div class="menu-item"><span class="material-icons-round" style="color:#3f51b5;font-size:18px">dark_mode</span> <strong>${t('dinner')}:</strong>&nbsp;${menu.dinner || '—'}</div>
                </div>
            `;
        }).join('')}
    `;
}

// ==================== STATS VIEW ====================
function renderStats(container) {
    const data = getData();
    const today = getTodayKey();
    const myTasks = data.tasks.filter(t => t.assignedTo.includes(currentUser.id));
    const todayTasks = myTasks.filter(t => isTaskForToday(t));
    const completions = data.completions[today] || {};
    const doneToday = todayTasks.filter(t => completions[`${currentUser.id}_${t.id}`]).length;
    const streak = (data.streaks && data.streaks[currentUser.id]) || 0;

    // Calculate weekly rate
    let weeklyDone = 0, weeklyTotal = 0;
    for (let i = 0; i < 7; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().split('T')[0];
        const dayCompletions = data.completions[key] || {};
        const dayTasks = myTasks.filter(t => isTaskForDay(t, d));
        weeklyTotal += dayTasks.length;
        weeklyDone += dayTasks.filter(t => dayCompletions[`${currentUser.id}_${t.id}`]).length;
    }
    const weeklyRate = weeklyTotal ? Math.round((weeklyDone / weeklyTotal) * 100) : 0;

    container.innerHTML = `
        <div class="date-header">
            <h2>${t('navStats')}</h2>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">${myTasks.length}</div>
                <div class="stat-label">${t('totalTasks')}</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${doneToday}/${todayTasks.length}</div>
                <div class="stat-label">${t('completedToday')}</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${streak}🔥</div>
                <div class="stat-label">${t('currentStreak')}</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${weeklyRate}%</div>
                <div class="stat-label">${t('weeklyRate')}</div>
            </div>
        </div>
        <div class="progress-section">
            <h4 style="margin-bottom:12px">${t('todayProgress')}</h4>
            ${renderCategoryBreakdown(todayTasks, completions)}
        </div>
    `;
}

function renderCategoryBreakdown(tasks, completions) {
    const categories = ['routine', 'islamic', 'chore', 'habit', 'duty', 'program'];
    return categories.map(cat => {
        const catTasks = tasks.filter(t => t.category === cat);
        if (catTasks.length === 0) return '';
        const done = catTasks.filter(t => completions[`${currentUser.id}_${t.id}`]).length;
        const pct = Math.round((done / catTasks.length) * 100);
        return `
            <div style="margin-bottom:12px">
                <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
                    <span>${t('cat' + cat.charAt(0).toUpperCase() + cat.slice(1))}</span>
                    <span>${done}/${catTasks.length}</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width:${pct}%"></div>
                </div>
            </div>
        `;
    }).join('');
}

// ==================== FAMILY VIEW (Parents only) ====================
function renderFamily(container) {
    if (currentUser.role !== 'parent') return;
    const data = getData();
    const today = getTodayKey();
    const completions = data.completions[today] || {};

    container.innerHTML = `
        <div class="date-header">
            <h2>${t('familyOverview')}</h2>
        </div>
        ${familyMembers.map(member => {
            const memberTasks = data.tasks.filter(t => t.assignedTo.includes(member.id) && isTaskForToday(t));
            const done = memberTasks.filter(t => completions[`${member.id}_${t.id}`]).length;
            const pct = memberTasks.length ? Math.round((done / memberTasks.length) * 100) : 0;
            return `
                <div class="family-member-card">
                    <div class="avatar" style="background:${member.color};width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:600;flex-shrink:0">${member.initials}</div>
                    <div class="fm-info">
                        <div class="fm-name">${getMemberName(member)}</div>
                        <div class="fm-stats">${done}/${memberTasks.length} ${t('tasksCompleted')} · ${pct}%</div>
                        <div class="progress-bar" style="margin-top:6px">
                            <div class="progress-fill" style="width:${pct}%"></div>
                        </div>
                    </div>
                </div>
            `;
        }).join('')}
    `;
}

// ==================== TASK MANAGEMENT (Parents) ====================
function openAddModal() {
    if (currentUser.role !== 'parent') return;
    editingTaskId = null;
    document.getElementById('modalTitle').textContent = t('addTask');
    document.getElementById('taskForm').reset();
    renderAssignChips();

    if (currentTab === 'menu') {
        document.getElementById('menuModalOverlay').classList.add('active');
    } else {
        document.getElementById('modalOverlay').classList.add('active');
    }
}

function renderAssignChips() {
    const chips = document.getElementById('assignChips');
    chips.innerHTML = familyMembers.map(m => `
        <div class="chip selected" onclick="toggleChip(this)" data-id="${m.id}">${getMemberName(m).split(' ')[0]}</div>
    `).join('');
}

function toggleChip(el) {
    el.classList.toggle('selected');
}

function closeModal(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('modalOverlay').classList.remove('active');
}

function closeMenuModal(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('menuModalOverlay').classList.remove('active');
}

function saveTask(e) {
    e.preventDefault();
    const data = getData();
    const assignedTo = Array.from(document.querySelectorAll('#assignChips .chip.selected')).map(c => c.dataset.id);

    if (assignedTo.length === 0) {
        alert('Please assign to at least one person');
        return;
    }

    const task = {
        id: editingTaskId || 'task_' + Date.now(),
        name: document.getElementById('taskNameInput').value,
        nameRu: document.getElementById('taskNameInput').value,
        nameTj: document.getElementById('taskNameInput').value,
        category: document.getElementById('taskCategory').value,
        time: document.getElementById('taskTime').value,
        assignedTo: assignedTo,
        repeat: document.getElementById('taskRepeat').value,
        notes: document.getElementById('taskNotes').value
    };

    if (editingTaskId) {
        const idx = data.tasks.findIndex(t => t.id === editingTaskId);
        if (idx !== -1) data.tasks[idx] = task;
    } else {
        data.tasks.push(task);
    }

    saveData(data);
    closeModal();
    renderCurrentTab();
}

function editTask(taskId) {
    if (currentUser.role !== 'parent') return;
    const data = getData();
    const task = data.tasks.find(t => t.id === taskId);
    if (!task) return;

    editingTaskId = taskId;
    document.getElementById('modalTitle').textContent = t('editTask');
    document.getElementById('taskNameInput').value = task.name;
    document.getElementById('taskCategory').value = task.category;
    document.getElementById('taskTime').value = task.time || '';
    document.getElementById('taskRepeat').value = task.repeat;
    document.getElementById('taskNotes').value = task.notes || '';

    renderAssignChips();
    document.querySelectorAll('#assignChips .chip').forEach(chip => {
        if (!task.assignedTo.includes(chip.dataset.id)) {
            chip.classList.remove('selected');
        }
    });

    document.getElementById('modalOverlay').classList.add('active');
}

function deleteTask(taskId) {
    if (currentUser.role !== 'parent') return;
    const data = getData();
    data.tasks = data.tasks.filter(t => t.id !== taskId);
    saveData(data);
    renderCurrentTab();
}

function showTaskOptions(e, taskId) {
    e.preventDefault();
    if (currentUser.role !== 'parent') return;
    if (confirm(`${t('edit')} / ${t('deleteTask')}?\n\nOK = ${t('deleteTask')}\nCancel = ${t('edit')}`)) {
        deleteTask(taskId);
    } else {
        editTask(taskId);
    }
}

function saveMenu(e) {
    e.preventDefault();
    const data = getData();
    const day = document.getElementById('menuDay').value;
    const meal = document.getElementById('mealType').value;
    const dish = document.getElementById('menuDishInput').value;

    let menuItem = data.menus.find(m => m.day === day);
    if (!menuItem) {
        menuItem = { day: day, breakfast: '', lunch: '', dinner: '' };
        data.menus.push(menuItem);
    }
    menuItem[meal] = dish;

    saveData(data);
    closeMenuModal();
    renderCurrentTab();
}

// ==================== UTILITY FUNCTIONS ====================
function getTodayKey() {
    return new Date().toISOString().split('T')[0];
}

function isTaskForToday(task) {
    const day = new Date().getDay(); // 0=Sun, 6=Sat
    if (task.repeat === 'daily') return true;
    if (task.repeat === 'weekdays') return day >= 1 && day <= 5;
    if (task.repeat === 'weekends') return day === 0 || day === 6;
    if (task.repeat === 'weekly') return true; // simplified
    if (task.repeat === 'once') return true; // simplified
    return true;
}

function isTaskForDay(task, date) {
    const day = date.getDay();
    if (task.repeat === 'daily') return true;
    if (task.repeat === 'weekdays') return day >= 1 && day <= 5;
    if (task.repeat === 'weekends') return day === 0 || day === 6;
    return true;
}

// ==================== INITIALIZATION ====================
function init() {
    // Initialize data if first time
    if (!localStorage.getItem('fm_data')) {
        saveData({ tasks: getDefaultTasks(), completions: {}, menus: getDefaultMenus(), streaks: {} });
    }

    applyTranslations();
    renderMemberList();

    // Check if user was previously logged in
    const savedUser = localStorage.getItem('fm_currentUser');
    if (savedUser) {
        currentUser = familyMembers.find(m => m.id === savedUser);
        if (currentUser) {
            enterApp();
            return;
        }
    }
}

// Service Worker Registration
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
}

init();
</script>
